# OncoSentinel v2.0 — Training Configuration: Kidney CT
task_id: "kidney_ct"
category: "kidney"
display_name: "Kidney CT Multi-Class Lesion Classification"
modality: "ct"
enabled: true

data:
  dataset_id: "CT-Kidney-v1"
  data_dir: "data/datasets/CT_Kidney"
  input_type: "image_2d"
  image_size: [224, 224]
  channels: 3
  class_names:
    - "normal"
    - "tumor"
    - "cyst"
    - "stone"
  class_mapping:
    0: "normal"
    1: "tumor"
    2: "cyst"
    3: "stone"
  split_manifest: "artifacts/manifests/kidney_ct_split.json"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  stratified: true
  grouping_key: "study_id"

model:
  family: "hybrid_cnn"
  branch: "ct"
  embedding_dim: 512
  num_classes: 4
  dropout: 0.3
  pretrained_weights: null

training:
  seed: 42
  batch_size: 16
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "cosine"
  early_stopping_patience: 4
  loss_function: "cross_entropy"

evaluation:
  primary_metric: "macro_f1"
  metrics:
    - "accuracy"
    - "macro_f1"
    - "sensitivity"
    - "specificity"
    - "confusion_matrix"
    - "brier_score"
    - "expected_calibration_error"

checkpoint:
  checkpoint_dir: "artifacts/checkpoints/kidney_ct"
  save_best_only: true
  save_optimizer: true
