# OncoSentinel v2.0 — Training Configuration: Cervical Cytology
task_id: "cervical_cytology"
category: "cervical"
display_name: "Cervical Pap Smear Cytology Cell Classification"
modality: "cytology"
enabled: true

data:
  dataset_id: "SIPaKMeD-v1"
  data_dir: "data/datasets/Cervical_Cytology"
  input_type: "image_2d"
  image_size: [224, 224]
  channels: 3
  class_names:
    - "dyskeratotic"
    - "koilocytotic"
    - "metaplastic"
    - "parabasal"
    - "superficial_intermediate"
  class_mapping:
    0: "dyskeratotic"
    1: "koilocytotic"
    2: "metaplastic"
    3: "parabasal"
    4: "superficial_intermediate"
  split_manifest: "artifacts/manifests/cervical_cytology_split.json"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  stratified: true
  grouping_key: "slide_id"

model:
  family: "hybrid_cnn"
  branch: "cytology"
  embedding_dim: 512
  num_classes: 5
  dropout: 0.3
  pretrained_weights: null

training:
  seed: 42
  batch_size: 16
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "cosine"
  early_stopping_patience: 4
  loss_function: "cross_entropy"

evaluation:
  primary_metric: "macro_f1"
  metrics:
    - "accuracy"
    - "macro_f1"
    - "sensitivity"
    - "specificity"
    - "confusion_matrix"
    - "brier_score"
    - "expected_calibration_error"

checkpoint:
  checkpoint_dir: "artifacts/checkpoints/cervical_cytology"
  save_best_only: true
  save_optimizer: true
