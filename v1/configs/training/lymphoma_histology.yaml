# OncoSentinel v2.0 — Training Configuration: Lymphoma Histopathology
task_id: "lymphoma_histology"
category: "lymphoma"
display_name: "Malignant Lymphoma Subtype Histopathology"
modality: "histology"
enabled: true

data:
  dataset_id: "Lymphoma-NIH-v1"
  data_dir: "data/datasets/Lymphoma"
  input_type: "image_2d"
  image_size: [224, 224]
  channels: 3
  class_names:
    - "cll"
    - "fl"
    - "mcl"
  class_mapping:
    0: "cll"
    1: "fl"
    2: "mcl"
  split_manifest: "artifacts/manifests/lymphoma_histology_split.json"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  stratified: true
  grouping_key: "case_id"

model:
  family: "hybrid_cnn"
  branch: "histology"
  embedding_dim: 512
  num_classes: 3
  dropout: 0.3
  pretrained_weights: null

training:
  seed: 42
  batch_size: 16
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler: "cosine"
  early_stopping_patience: 4
  loss_function: "cross_entropy"

evaluation:
  primary_metric: "macro_f1"
  metrics:
    - "accuracy"
    - "macro_f1"
    - "sensitivity"
    - "specificity"
    - "confusion_matrix"
    - "brier_score"
    - "expected_calibration_error"

checkpoint:
  checkpoint_dir: "artifacts/checkpoints/lymphoma_histology"
  save_best_only: true
  save_optimizer: true
