# OncoSentinel v2.0 — Authoritative Taxonomy Configuration
# Version: 2.0.0
# This file is the SINGLE SOURCE OF TRUTH for category routing.
# Any change requires an ADR in docs/decisions/ and a calibration re-run.
# Satisfies: FR-02, FR-04, FR-28

version: "2.0.0"
updated_at: "2024-01-01"

categories:

  # ── Phase 1 Categories ────────────────────────────────────────────────────

  breast:
    display_name: "Breast Cancer"
    class_mapping:
      0: "benign"
      1: "malignant"
    supported_modalities:
      - "ultrasound"
      - "histology"
    datasets:
      - id: "BUSI-v1"
        name: "Breast Ultrasound Images Dataset"
        split_config: "configs/splits/busi_split.json"
        license: "CC-BY-4.0"
        source_url: "https://www.kaggle.com/datasets/aryashah2k/breast-ultrasound-images-dataset"
      - id: "BreakHis-v1"
        name: "BreaKHis Dataset"
        split_config: "configs/splits/breakhis_split.json"
        license: "CC-BY-NC-SA-4.0"
        source_url: "https://web.inf.ufpr.br/vri/databases/breast-cancer-histopathological-database-breakhis/"
    calibration_policy: "temperature_scaling+isotonic+conformal"
    calibration_method_priority: ["conformal", "temperature_scaling", "isotonic"]
    uncertainty_policy: "entropy+mahalanobis+energy"
    uncertainty_threshold_ref: "breast"   # key in thresholds.yaml
    explanation_type: "concept_bottleneck+gradcam_audit"
    clinical_concepts:
      - "mass_shape"
      - "mass_margin"
      - "mass_density"
      - "calcification_pattern"
      - "nuclear_grade"
      - "architectural_distortion"
    fairness_strata:
      - "age_group"
      - "scanner_vendor"
      - "institution"
      - "biopsy_site"
    clinical_study_status: "UNTRAINED"
    phase_availability: 1
    model_card: "artifacts/model_cards/breast_ultrasound.md"

  kidney:
    display_name: "Kidney Cancer"
    class_mapping:
      0: "normal"
      1: "tumor"
    supported_modalities:
