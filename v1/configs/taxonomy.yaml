        split_config: "configs/splits/kits_split.json"
        license: "CC-BY-NC-SA-4.0"
        source_url: "https://kits-challenge.org/kits23/"
      - id: "CT-Kidney-v1"
        name: "CT Kidney Dataset: Normal-Cyst-Tumor-Stone"
        split_config: "configs/splits/ct_kidney_split.json"
        license: "CC-BY-4.0"
        source_url: "https://www.kaggle.com/datasets/nazmul0087/ct-kidney-dataset-normal-cyst-tumor-and-stone"
    calibration_policy: "temperature_scaling+isotonic+conformal"
    calibration_method_priority: ["conformal", "temperature_scaling", "isotonic"]
    uncertainty_policy: "entropy+mahalanobis+energy"
    uncertainty_threshold_ref: "kidney"
    explanation_type: "segmentation_concept+gradcam_audit"
    clinical_concepts:
      - "lesion_size"
      - "lesion_density"
      - "lesion_location"
      - "cortical_involvement"
      - "enhancement_pattern"
    fairness_strata:
      - "age_group"
      - "sex"
      - "institution"
      - "scanner_protocol"
    clinical_study_status: "ACTIVE"
    phase_availability: 1
    model_card: "artifacts/model_cards/kidney_ct.md"

