# OncoSentinel v2.0 — Authoritative Model Registry & Training Specification
# Version: 2.0.0
# Single Source of Truth for the MobileNetV3-Small multi-cancer model portfolio.
# Synchronized with configs/taxonomy.yaml and models/*.pth weights.

version: "2.0.0"
global_defaults:
  seed: 42
  deterministic: true
  device: "auto"
  num_workers: 2
  pin_memory: false
  mixed_precision: false
  shared_backbone_dim: 576
  checkpoint_root: "../models"
  metrics_root: "artifacts/metrics"
  logs_root: "artifacts/logs"
  model_cards_root: "artifacts/model_cards"
  splits_root: "configs/splits"

tasks:
  # ── 1. Breast Ultrasound (Untrained / Scaffolded) ─────────────────────────
  breast_ultrasound:
    task_id: "breast_ultrasound"
    category: "breast"
    display_name: "Breast Cancer Ultrasound Classification"
    modality: "ultrasound"
    enabled: false
    status: "UNTRAINED"
    data:
      dataset_id: "BUSI-v1"
      data_dir: "data/datasets/breast_ultrasound"
      image_size: [224, 224]
      channels: 3
      class_names: ["benign", "malignant"]
      class_mapping:
        0: "benign"
        1: "malignant"
      split_manifest: "configs/splits/breast_ultrasound_split.json"
      grouping_key: "patient_id"
    model:
      architecture: "MobileNetV3-Small"
      modality_branch: "ultrasound_encoder"
      shared_trunk: true
      embedding_dim: 576
      num_classes: 2
      dropout: 0.2
    training:
      batch_size: 16
      epochs: 15
      learning_rate: 0.001
      weight_decay: 0.0001
      optimizer: "adamw"
      scheduler: "cosine"
      loss: "cross_entropy"
      class_weights: "balanced"
      early_stopping_patience: 5
      selection_metric: "macro_f1"
    checkpoint:
      best_path: "../models/breast_model.pth"
      sha256: null
      version: "untrained"

  # ── 2. Kidney CT (Active — Deployed MobileNetV3-Small) ────────────────────
  kidney_ct:
    task_id: "kidney_ct"
    category: "kidney"
    display_name: "Kidney CT Tumor Classification"
    modality: "ct"
    enabled: true
    status: "ACTIVE"
    data:
      dataset_id: "CT-Kidney-v1"
      data_dir: "data/datasets/kidney_ct"
      image_size: [224, 224]
      channels: 3
      class_names: ["normal", "tumor"]
      class_mapping:
        0: "normal"
        1: "tumor"
      split_manifest: "configs/splits/kidney_ct_split.json"
      grouping_key: "patient_id"
    model:
      architecture: "MobileNetV3-Small"
      modality_branch: "ct_encoder"
      shared_trunk: false
      embedding_dim: 576
      num_classes: 2
      dropout: 0.2
    training:
      batch_size: 16
      epochs: 15
      learning_rate: 0.001
      weight_decay: 0.0001
      optimizer: "adamw"
      scheduler: "cosine"
      loss: "cross_entropy"
      class_weights: "balanced"
      early_stopping_patience: 5
      selection_metric: "macro_f1"
    checkpoint:
      best_path: "../models/kidney_model.pth"
      sha256: "b0ad31aa209358f9dff0643adcf66a1a387ee1c71dfca1ccb03c5251be28b071"
      version: "v2.0.0-kidney-mbv3s"

